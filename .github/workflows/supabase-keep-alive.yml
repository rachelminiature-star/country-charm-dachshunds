# Keeps the free-tier Supabase project from pausing after 7 days of inactivity.
# Runs a tiny read-only query against the public "puppies" table twice a week.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 9 * * 1,4" # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch: {} # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/puppies?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then exit 1; fi
